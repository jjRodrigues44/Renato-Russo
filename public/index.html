<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grana</title>
<meta name="description" content="Organize suas contas em casal, com sincronização em tempo real.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
:root {
  --bg:#FFFFFF; --surface:#FFFFFF; --s2:#F5F4F1; --s3:#ECEAE6; --s-soft:#FAFAF8;
  --line:#DDDAD4; --line-soft:#EBE9E4;
  --fg:#1F1E1D; --muted2:#54514C; --muted:#6B6862;
  --ink:#262624; --on-ink:#FFFFFF; --ink-soft:#CFCCC5;
  --primary:#820AD1; --primary-strong:#6A08AB; --on-primary:#FFFFFF;
  --accent-soft:#F3E6FC; --accent-ink:#6A08AB;
  --good:#1B7A4B; --good-dot:#7DDBA3;
  --warn-bg:#FFF1E0; --warn-fg:#9A4A00; --warn-dot:#FFB86B;
  --bad-bg:#FCEEEE; --bad-fg:#B3261E;
  --hero:#262624; --hero-fg:#FFFFFF; --hero-soft:#CFCCC5; --hero-bar:#C98AF3; --hero-line:rgba(255,255,255,.14);
  --shade:rgba(31,30,29,.5);
  --ring-a:#262624; --ring-b:#820AD1; --ring-c:#C98AF3; --ring-d:#8A8780; --ring-e:#54514C;
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1F1E1D; --surface:#262624; --s2:#30302E; --s3:#3A3936; --s-soft:#2A2A28;
  --line:#46443F; --line-soft:#383733; --fg:#F2F0EB; --muted2:#CFCCC5; --muted:#A8A59E;
  --ink:#30302E; --on-ink:#F2F0EB; --ink-soft:#CFCCC5;
  --primary:#9A2DE0; --primary-strong:#7D1FBF; --accent-soft:#3B2A4B; --accent-ink:#D2A0F8;
  --good:#7DDBA3; --warn-bg:#3A2A14; --warn-fg:#FFB86B; --bad-bg:#3B1B1A; --bad-fg:#FFB4AB;
  --hero:#30302E; --shade:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1F1E1D; --surface:#262624; --s2:#30302E; --s3:#3A3936; --s-soft:#2A2A28;
  --line:#46443F; --line-soft:#383733; --fg:#F2F0EB; --muted2:#CFCCC5; --muted:#A8A59E;
  --ink:#30302E; --on-ink:#F2F0EB; --accent-soft:#3B2A4B; --accent-ink:#D2A0F8;
  --primary:#9A2DE0; --primary-strong:#7D1FBF;
  --good:#7DDBA3; --warn-bg:#3A2A14; --warn-fg:#FFB86B; --bad-bg:#3B1B1A; --bad-fg:#FFB4AB;
  --hero:#30302E; --shade:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100% }
body{ margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--surface) }
button{ font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation }
input,select{ font:inherit; color:inherit }
a{ color:var(--primary); text-decoration:none } a:hover{ color:var(--primary-strong) }
h1,h2,p{ margin:0 }
:focus-visible{ outline:2px solid var(--primary); outline-offset:2px }
.num{ font-variant-numeric:tabular-nums }
.disp{ font-family:var(--display) }
.ico{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none }
.ico.s3{ width:12px; height:12px; stroke-width:3 } .ico.s4{ width:18px; height:18px } .ico.s6{ width:26px; height:26px }

/* coluna central */
.screen{ max-width:440px; margin:0 auto; min-height:100vh; min-height:100dvh; position:relative; padding-bottom:calc(112px + env(safe-area-inset-bottom,0px)) }
.gutter{ padding-left:max(20px,env(safe-area-inset-left,0px)); padding-right:max(20px,env(safe-area-inset-right,0px)) }
.hdr{ padding:20px 20px 4px }
.hdr .eyebrow{ font-size:14px; font-weight:500; color:var(--muted) }
.hdr .title{ margin-top:2px; font-family:var(--display); font-size:28px; line-height:34px; font-weight:700; letter-spacing:-.02em }
.hdr-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px }
.main{ padding:16px 20px 8px; display:flex; flex-direction:column; gap:24px }

/* botões */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:52px; padding:0 18px; border-radius:999px; background:var(--primary); color:var(--on-primary); font-size:16px; font-weight:600; transition:background .15s }
.btn:hover{ background:var(--primary-strong) }
.btn.wide{ width:100%; height:56px; font-size:17px }
.btn.ghost{ background:var(--surface); color:var(--fg); border:1px solid var(--line) }
.btn.ghost:hover{ background:var(--s2) }
.btn.tonal{ background:var(--s2); color:var(--fg) } .btn.tonal:hover{ background:var(--s3) }
.btn.sm{ height:44px; padding:0 16px; font-size:15px }
.btn.danger{ background:var(--bad-fg); color:#fff }
.btn:disabled{ opacity:.6; cursor:default }
.link{ display:inline-flex; align-items:center; min-height:44px; font-size:15px; font-weight:600; color:var(--primary) }

/* hero */
.hero{ border-radius:24px; padding:24px; background:var(--hero); color:var(--hero-fg); box-shadow:0 14px 35px rgba(31,30,29,.22) }
.hero .lab{ font-size:14px; color:var(--hero-soft) }
.hero .big{ margin-top:4px; font-family:var(--display); font-size:40px; line-height:44px; font-weight:700; letter-spacing:-.03em; overflow-wrap:anywhere }
.hero .big.neg{ color:#FFB4AB }
.hero .meter{ margin-top:20px; height:8px; border-radius:99px; background:rgba(255,255,255,.16); overflow:hidden }
.hero .meter i{ display:block; height:100%; border-radius:99px; background:var(--hero-bar) }
.hero .mfoot{ margin-top:10px; display:flex; justify-content:space-between; gap:12px; font-size:13px }
.hero .mfoot .soft{ color:var(--hero-soft) }
.hero-grid{ margin-top:20px; padding-top:20px; border-top:1px solid var(--hero-line); display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px }
.hstat .k{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--hero-soft) }
.hstat .dot{ width:8px; height:8px; border-radius:99px }
.hstat .v{ margin-top:4px; font-family:var(--display); font-size:20px; line-height:26px; font-weight:700; letter-spacing:-.02em; overflow-wrap:anywhere }
.hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px }
.hero .chip{ width:44px; height:44px; border-radius:14px; background:rgba(255,255,255,.12); display:grid; place-items:center }
.hero .note{ margin-top:16px; padding-top:16px; border-top:1px solid var(--hero-line); font-size:14px; color:var(--hero-soft) }
.hero .note b{ color:#fff; font-weight:600 }

/* atalhos */
.qa-row{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px }
.qa{ min-height:96px; border-radius:20px; background:var(--s2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--fg); font-size:14px; font-weight:500 }
.qa:hover{ background:var(--s3) }
.qa .ic{ width:44px; height:44px; border-radius:50%; background:var(--surface); display:grid; place-items:center; color:var(--fg) }
.qa.primary .ic{ background:var(--primary); color:var(--on-primary) }

/* callout */
.callout{ display:flex; align-items:center; gap:14px; padding:16px; border-radius:20px; background:var(--accent-soft); color:var(--fg); text-align:left }
.callout .ic{ width:44px; height:44px; flex:none; border-radius:14px; background:var(--surface); color:var(--primary); display:grid; place-items:center }
.callout .grow{ flex:1; min-width:0 }
.callout .t{ display:block; font-size:16px; font-weight:600 }
.callout .s{ display:block; margin-top:2px; font-size:14px; color:var(--muted2) }
.callout .go{ width:40px; height:40px; flex:none; border-radius:50%; background:var(--primary); color:var(--on-primary); display:grid; place-items:center }

/* seções */
.sec-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px }
.sec-head h2{ font-family:var(--display); font-size:20px; line-height:26px; font-weight:700; letter-spacing:-.01em }
.pill{ padding:4px 12px; border-radius:99px; background:var(--s3); font-size:13px; font-weight:500; color:var(--muted2) }

/* listas e linhas */
.list{ border:1px solid var(--line); border-radius:20px; overflow:hidden }
.row{ display:flex; align-items:center; gap:10px; min-height:72px; padding:12px 16px 12px 8px; border-bottom:1px solid var(--line-soft) }
.row:last-child{ border-bottom:0 }
.row .grow{ flex:1; min-width:0 }
.row .t{ font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.row .sub{ margin-top:2px; display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); flex-wrap:wrap }
.row .amount{ font-size:16px; font-weight:600; white-space:nowrap }
.row.paid .t{ color:var(--muted); text-decoration:line-through; font-weight:500 }
.row.paid .amount{ color:var(--muted); font-weight:500 }
.check{ width:44px; height:44px; flex:none; display:grid; place-items:center }
.check .box{ width:24px; height:24px; box-sizing:border-box; border-radius:8px; border:1.5px solid var(--muted); background:var(--surface); display:grid; place-items:center; color:transparent }
.check[aria-pressed="true"] .box{ background:var(--primary); border-color:var(--primary); color:var(--on-primary) }
.iconbtn{ width:44px; height:44px; flex:none; border-radius:12px; display:grid; place-items:center; color:var(--muted) }
.iconbtn:hover{ background:var(--s2); color:var(--fg) }
.iconbtn.bad:hover{ color:var(--bad-fg) }
.tag{ padding:2px 8px; border-radius:99px; font-size:12px; line-height:16px; font-weight:600 }
.tag.warn{ background:var(--warn-bg); color:var(--warn-fg) }
.tag.bad{ background:var(--bad-bg); color:var(--bad-fg) }
.tag.ok{ color:var(--good); background:transparent; padding-left:0; font-weight:500 }
.confirm{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end }
.confirm span{ font-size:13px; color:var(--muted2) }

/* recap */
.recap{ display:flex; align-items:center; gap:14px; padding:16px; border-radius:20px; background:var(--s2) }
.recap .ic{ width:44px; height:44px; flex:none; border-radius:14px; background:var(--accent-soft); color:var(--primary); display:grid; place-items:center }
.recap p{ font-size:16px } .recap small{ display:block; margin-top:2px; font-size:14px; color:var(--muted2) }

/* contas: stats + filtro + categorias */
.stats{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px }
.stat{ padding:16px; border:1px solid var(--line); border-radius:20px }
.stat .k{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:var(--muted) }
.stat .dot{ width:8px; height:8px; border-radius:99px } .stat .dot.g{ background:var(--good) } .stat .dot.o{ background:var(--warn-fg) }
.stat .v{ margin-top:10px; font-family:var(--display); font-size:22px; line-height:28px; font-weight:700; letter-spacing:-.02em; overflow-wrap:anywhere }
.stat .d{ margin-top:2px; font-size:14px; color:var(--muted) }
.seg{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; padding:4px; border-radius:999px; background:var(--s2) }
.seg button{ height:44px; border-radius:999px; font-size:15px; font-weight:500; color:var(--muted2); transition:background .28s ease, color .22s ease, transform .12s ease }
.seg button[aria-pressed="true"]{ background:var(--primary); color:#fff; font-weight:600 }
.cat-h{ display:flex; align-items:center; gap:14px; width:100%; min-height:76px; padding:12px 16px; text-align:left; border-bottom:1px solid var(--line) }
.cat-h:last-child{ border-bottom:0 }
.cat-h.open{ background:var(--s-soft); border-bottom:0 }
.ring{ position:relative; width:52px; height:52px; flex:none; border-radius:50%; background:conic-gradient(var(--rc,var(--ink)) calc(var(--p,0)*1%), var(--line-soft) 0); display:grid; place-items:center }
.ring b{ width:42px; height:42px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-size:12px; font-weight:700 }
.cat-h .grow{ flex:1; min-width:0 }
.cat-name{ display:block; font-size:16px; font-weight:600 }
.cat-sub{ display:block; font-size:14px; color:var(--muted2) }
.cat-sub b{ color:var(--warn-fg); font-weight:600 }
.caret{ color:var(--muted); transition:transform .2s }
.cat-body{ padding:0 8px 8px; background:var(--s-soft) }
.cat-body .row{ padding:8px 0; border-top:1px solid var(--line-soft); border-bottom:0; min-height:72px }

/* histórico */
.mlist .month{ display:flex; align-items:flex-start; gap:14px; width:100%; padding:16px; text-align:left; border-bottom:1px solid var(--line-soft) }
.mlist .month:last-child{ border-bottom:0 } .mlist .month:hover{ background:var(--s-soft) }
.month .mic{ width:44px; height:44px; flex:none; border-radius:14px; background:var(--accent-soft); color:var(--primary); display:grid; place-items:center }
.month .mic.neg{ background:var(--bad-bg); color:var(--bad-fg) }
.month .grow{ flex:1; min-width:0 }
.month .line{ display:flex; justify-content:space-between; gap:12px }
.month .mname{ font-size:16px; font-weight:600 }
.month .bal{ font-size:16px; font-weight:700; color:var(--primary); white-space:nowrap } .month .bal.neg{ color:var(--bad-fg) }
.month .ms{ display:block; margin-top:2px; font-size:14px; color:var(--muted) }
.mbar{ display:block; margin-top:10px; height:6px; border-radius:99px; background:var(--line-soft); overflow:hidden }
.mbar i{ display:block; height:100%; border-radius:99px; background:var(--primary) } .mbar i.neg{ background:var(--bad-fg) }
.back{ display:inline-flex; align-items:center; gap:4px; min-height:44px; font-size:15px; font-weight:600; color:var(--primary) }

/* perfil */
.pcard{ padding:20px; border:1px solid var(--line); border-radius:24px }
.ptop{ display:flex; align-items:center; gap:16px }
.ptop>.grow{ flex:1; min-width:0 }
.ptop>.btn{ flex:none }
.avatar{ width:72px; height:72px; flex:none; border-radius:20px; overflow:hidden; background:#332D4B }
.avatar img{ width:100%; height:100%; object-fit:cover; display:block }
.pname{ font-size:20px; line-height:26px; font-weight:600; overflow-wrap:anywhere }
.pemail{ margin-top:2px; font-size:14px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.pdiv{ margin-top:20px; padding-top:20px; border-top:1px solid var(--line-soft) }
.pdiv .t{ font-size:16px; font-weight:600 } .pdiv .s{ margin-top:2px; font-size:14px; color:var(--muted) }
.avs{ margin-top:14px; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px }
.av{ position:relative; aspect-ratio:1; border-radius:16px; overflow:hidden; padding:0; background:#332D4B }
.av img{ width:100%; height:100%; object-fit:cover; display:block }
.av[aria-pressed="true"]{ outline:2.5px solid var(--primary); outline-offset:2px }
.av .tick{ position:absolute; right:-4px; bottom:-4px; width:22px; height:22px; border-radius:99px; background:var(--primary); color:#fff; display:grid; place-items:center; border:2px solid var(--surface) }
.prow{ display:flex; align-items:center; gap:14px; min-height:84px; padding:14px 16px; border-bottom:1px solid var(--line-soft) }
.prow:last-child{ border-bottom:0 }
.prow .ic{ width:44px; height:44px; flex:none; border-radius:14px; background:var(--accent-soft); color:var(--primary); display:grid; place-items:center }
.prow .ic.grey{ background:var(--s2); color:var(--fg) }
.prow .ic.bad{ background:var(--bad-bg); color:var(--bad-fg) }
.prow .grow{ flex:1; min-width:0 }
.prow .t{ font-size:16px; font-weight:600 } .prow .s{ margin-top:2px; font-size:14px; color:var(--muted) }
.switch{ width:52px; height:44px; flex:none; display:grid; place-items:center }
.switch .track{ width:52px; height:32px; box-sizing:border-box; padding:4px; border-radius:99px; background:var(--muted); display:flex; justify-content:flex-start; transition:background .15s }
.switch[aria-checked="true"] .track{ background:var(--primary); justify-content:flex-end }
.switch .knob{ width:24px; height:24px; border-radius:99px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25) }
.logout{ display:flex; align-items:center; gap:14px; min-height:72px; padding:14px 16px; color:var(--bad-fg); width:100%; text-align:left }

/* vazio / passos */
.empty{ padding:28px 20px; text-align:center; border:1px solid var(--line); border-radius:24px }
.empty h3{ margin:0; font-family:var(--display); font-size:18px; font-weight:700 }
.empty p{ margin:6px auto 0; max-width:40ch; font-size:14px; color:var(--muted2) }
.empty .acts{ margin-top:18px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center }
.steps{ margin:18px auto 0; padding:0; list-style:none; max-width:320px; display:flex; flex-direction:column; gap:10px; text-align:left }
.steps li{ display:flex; gap:12px; align-items:center; font-size:15px }
.steps b{ width:26px; height:26px; flex:none; border-radius:99px; background:var(--accent-soft); color:var(--primary); display:grid; place-items:center; font-size:13px }
.banner{ padding:12px 16px; border-radius:14px; background:var(--warn-bg); color:var(--warn-fg); font-size:14px }

/* navegação inferior */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabbar .row2{ max-width:440px; margin:0 auto; padding:8px 8px 20px; display:flex; align-items:flex-start }
.tab{ flex:1 1 0; min-width:0; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:12px; font-weight:500; color:var(--muted) }
.tab[aria-current="page"]{ color:var(--fg); font-weight:600 }
.tab .ic{ width:56px; height:32px; border-radius:16px; display:grid; place-items:center }
.tab[aria-current="page"] .ic{ background:var(--accent-soft); color:var(--primary) }
.fab{ flex:none; width:56px; height:56px; margin:-20px 6px 0; border-radius:50%; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; box-shadow:0 8px 20px rgba(130,10,209,.32) }

/* autenticação */
.auth{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column }
.topnav{ display:flex; align-items:center; justify-content:space-between; padding:12px 12px 0 }
.topnav .brand{ display:flex; align-items:center; gap:8px; padding-right:8px; font-size:18px; font-weight:500; color:#2A6F94 }
.topnav .iconbtn{ color:var(--fg) }
.auth-main{ padding:24px 20px 0; display:flex; flex-direction:column; gap:28px }
.auth-main h1{ font-family:var(--display); font-size:32px; line-height:38px; font-weight:700; letter-spacing:-.025em }
.auth-main .sub{ margin-top:8px; font-size:16px; line-height:24px; color:var(--muted2) }
.form{ display:flex; flex-direction:column; gap:20px }
.field label, .field .lab{ display:block; margin-bottom:8px; font-size:14px; line-height:20px; font-weight:600; color:var(--muted2) }
.field .inp{ width:100%; box-sizing:border-box; height:52px; padding:0 16px; border:1px solid var(--line); border-radius:14px; background:var(--surface); font-size:16px; color:var(--fg) }
.field .inp::placeholder{ color:#8A8780 }
.field .inp:focus{ outline:2px solid var(--primary); outline-offset:0; border-color:var(--primary) }
.field select.inp{ appearance:none; -webkit-appearance:none; padding-right:46px }
.field .hint{ margin:6px 0 0; font-size:14px; color:var(--muted) }
.inp.area{ height:auto; min-height:180px; padding:12px 14px; line-height:1.45; resize:vertical; font-size:15px; font-family:inherit }
.pwrap{ position:relative }
.pwrap .inp{ padding-right:56px }
.eye{ position:absolute; right:4px; top:4px; width:44px; height:44px; border-radius:10px; display:grid; place-items:center; color:var(--muted) }
.selwrap{ position:relative }
.selwrap .car{ position:absolute; right:16px; top:16px; pointer-events:none; color:var(--muted) }
.err{ padding:10px 14px; border-radius:14px; background:var(--bad-bg); color:var(--bad-fg); font-size:14px }
.auth-foot{ margin-top:4px; display:flex; justify-content:center; align-items:center; gap:6px; font-size:15px; color:var(--muted2) }
.readcard{ padding:10px 14px; border-radius:14px; background:var(--accent-soft); color:var(--accent-ink); font-size:14px; overflow-wrap:anywhere }

/* bottom sheet / modais */
.scrim{ position:fixed; inset:0; z-index:70; display:flex; align-items:flex-end; justify-content:center; background:var(--shade) }
.sheet{ width:100%; max-width:440px; max-height:92dvh; overflow:auto; overscroll-behavior:contain; background:var(--surface); border-radius:28px 28px 0 0; padding:10px 20px 32px; padding-bottom:max(32px,env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 40px rgba(0,0,0,.2) }
.grab{ align-self:center; width:40px; height:5px; border-radius:99px; background:var(--line); margin:0 auto 16px }
.sheet-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px }
.sheet-head h2{ font-family:var(--display); font-size:24px; line-height:30px; font-weight:700; letter-spacing:-.02em }
.sheet-head p{ margin-top:2px; font-size:15px; color:var(--muted) }
.closeb{ width:44px; height:44px; flex:none; border-radius:50%; background:var(--s2); color:var(--fg); display:grid; place-items:center }
.value-field label{ display:block; font-size:14px; font-weight:600; color:var(--muted2) }
.value-input{ margin-top:4px; width:100%; box-sizing:border-box; height:64px; padding:0; border:0; border-bottom:2px solid var(--primary); background:transparent; font-family:var(--display); font-size:36px; font-weight:700; letter-spacing:-.02em; outline:none; color:var(--fg) }
.chips{ display:flex; flex-wrap:wrap; gap:8px }
.chip{ height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--line); font-size:15px; font-weight:500; background:var(--surface); color:var(--fg) }
.chip[aria-pressed="true"]{ border:1.5px solid var(--primary); background:var(--accent-soft); color:var(--accent-ink); font-weight:600 }
.sheet .form{ gap:16px }
.sheet-ico{ width:64px; height:64px; border-radius:20px; background:var(--accent-soft); color:var(--primary); display:grid; place-items:center }
.benefits{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px }
.benefits li{ display:flex; align-items:center; gap:12px; font-size:15px }
.benefits .c{ width:28px; height:28px; flex:none; border-radius:99px; background:#E6F6EC; color:var(--good); display:grid; place-items:center }
.note{ padding:12px 14px; border-radius:14px; background:var(--s2); font-size:14px; color:var(--muted2) }

/* toast */
.toast{ position:fixed; left:50%; transform:translateX(-50%); z-index:80; width:max-content; max-width:calc(100vw - 32px); bottom:calc(104px + env(safe-area-inset-bottom,0px)); padding:12px 16px; border-radius:14px; background:var(--fg); color:var(--bg); font-size:14px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.25) }

/* tela de abertura (boas-vindas) */
#welcome{ position:fixed; inset:0; z-index:100; overflow:hidden; background:#5ea1c4; color:#06496b; font-family:var(--font) }
#welcome[hidden]{ display:none }
#welcome .sky,#welcome .grain,#welcome canvas{ position:absolute; inset:0; width:100%; height:100%; display:block }
#welcome .grain{ opacity:.42; mix-blend-mode:soft-light; pointer-events:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.15'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>") }
#welcome .w-top{ position:absolute; left:0; right:0; top:0; z-index:2; padding:calc(env(safe-area-inset-top,0px) + clamp(48px,9vh,84px)) max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px)) }
#welcome .w-inner{ max-width:620px; display:flex; flex-direction:column; gap:20px }
#welcome .w-brand{ display:flex; align-items:center; gap:10px; font-size:24px; font-weight:500; letter-spacing:-.01em; color:#2A6F94 }
#welcome .w-brand svg{ width:24px; height:28px; flex:none }
#welcome h1{ margin:0; font-family:var(--display); font-size:clamp(32px,9vw,44px); line-height:1.08; font-weight:700; letter-spacing:-.025em; color:#06496B; max-width:340px; text-wrap:balance }
#welcome .w-lede{ margin:0; font-size:17px; line-height:26px; color:#06496B; max-width:320px }
#welcome .w-bottom{ position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; justify-content:center; padding:24px max(24px,env(safe-area-inset-right,0px)) max(28px,calc(env(safe-area-inset-bottom,0px) + 16px)) max(24px,env(safe-area-inset-left,0px)) }
#welcome .w-actions{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px }
#welcome .w-btn{ width:100%; height:56px; border-radius:999px; background:#820AD1; color:#fff; font:600 17px var(--font); letter-spacing:.01em; box-shadow:0 14px 30px rgba(60,10,100,.35); transition:background .15s, opacity .2s, transform .15s; display:grid; place-items:center }
#welcome .w-btn:hover:not(:disabled){ background:#6A08AB }
#welcome .w-btn:active:not(:disabled){ transform:scale(.98) }
#welcome .w-btn:disabled{ opacity:.72; cursor:progress }
#welcome .w-btn.ghost{ background:rgba(255,255,255,.92); color:#06496B; box-shadow:none; height:52px; font-weight:600 }
#welcome .w-btn:focus-visible{ outline:3px solid #fff; outline-offset:3px }

.load{ padding:80px 20px; text-align:center; color:var(--muted); font-size:15px }

@media (min-width:480px){ .scrim{ align-items:center; padding:20px } .sheet{ border-radius:28px } }

.otag{ padding:2px 8px; border-radius:99px; font-size:11px; font-weight:600 }
.otag.you{ background:#E8F1FB; color:#1D6FB8 }
.otag.par{ background:#FDE9EF; color:#C2185B }
.otag.sha{ background:var(--accent-soft); color:var(--accent-ink) }
.seg.owner{ grid-template-columns:repeat(4,minmax(0,1fr)) }
.seg.owner button{ font-size:13px; padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.crow{ display:flex; align-items:center; gap:12px; min-height:68px; padding:12px 16px; border-bottom:1px solid var(--line-soft) }
.crow:last-child{ border-bottom:0 }
.crow .cdot{ width:10px; height:10px; flex:none; border-radius:99px }
.crow .cdot.you{ background:#1D6FB8 } .crow .cdot.par{ background:#C2185B } .crow .cdot.sha{ background:var(--primary) }
.crow .grow{ flex:1; min-width:0 } .crow .t{ font-size:16px; font-weight:600 } .crow .s{ margin-top:2px; font-size:13px; color:var(--muted) } .crow .amount{ font-family:var(--display); font-weight:700; white-space:nowrap }
.monthnav{ margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px; border:1px solid var(--line); border-radius:999px }
.monthnav .mnav{ width:40px; height:40px; flex:none; border-radius:999px; display:grid; place-items:center; color:var(--fg) }
.monthnav .mnav:hover{ background:var(--s2) }
.monthnav .mncur{ flex:1; text-align:center; font-family:var(--display); font-size:16px; font-weight:700; letter-spacing:-.01em }
.mntag{ font-family:var(--font); font-size:11px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:2px 8px; border-radius:99px; vertical-align:middle }
.monthincome{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:14px 16px; border:1px dashed var(--line); border-radius:16px; font-size:14px; font-weight:500; color:var(--muted2); text-align:left }
.monthincome:hover{ background:var(--s-soft) }
.monthincome .num{ font-family:var(--display); font-weight:700; color:var(--fg) }
.monthincome .edit{ font-family:var(--font); font-size:13px; font-weight:600; color:var(--primary); margin-left:8px }

/* micro-animações */
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }
@keyframes sheetUp{ from{ transform:translateY(100%) } to{ transform:none } }
@keyframes scrimIn{ from{ opacity:0 } to{ opacity:1 } }
@keyframes toastIn{ from{ opacity:0; transform:translate(-50%,10px) } to{ opacity:1; transform:translate(-50%,0) } }
@keyframes pop{ from{ transform:scale(.6) } to{ transform:scale(1) } }
.screen.anim{ animation:fadeUp .24s cubic-bezier(.2,.7,.3,1) both }
.auth-main{ animation:fadeUp .26s cubic-bezier(.2,.7,.3,1) both }
.scrim{ animation:scrimIn .18s ease both }
.sheet{ animation:sheetUp .3s cubic-bezier(.2,.8,.25,1) both }
.toast{ animation:toastIn .22s cubic-bezier(.2,.7,.3,1) both }
.btn,.qa,.chip,.tab,.av,.month,.cat-h,.callout,.iconbtn,.closeb,.fab,.check,.switch,.seg button,.link,.w-btn,.logout,.prow,.row{ transition:background .16s ease, color .16s ease, transform .12s ease, box-shadow .16s ease, border-color .16s ease, outline-color .12s ease }
.btn:active,.chip:active,.seg button:active,.closeb:active,.link:active,.w-btn:active{ transform:scale(.97) }
.qa:active,.callout:active,.month:active,.cat-h:active,.av:active{ transform:scale(.985) }
.fab:active{ transform:scale(.92) }
.iconbtn:active,.check:active{ transform:scale(.9) }
.check .box{ transition:background .16s ease, border-color .16s ease, color .16s ease }
.check[aria-pressed="true"] .box .ico{ animation:pop .2s cubic-bezier(.3,1.4,.5,1) both }
.switch .track{ transition:background .18s ease, justify-content .18s ease }
.switch .knob{ transition:transform .18s ease }
.meter i,.mbar i{ transition:width .55s cubic-bezier(.2,.7,.3,1) }
.hero .big{ transition:color .2s ease }

@media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; scroll-behavior:auto !important } }

[hidden]{display:none!important} img{max-width:100%}
.invite{ margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.invite .code{ font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:.15em; padding:6px 14px; border-radius:12px; background:var(--accent-soft); color:var(--accent-ink) }
.rlist{ display:flex; flex-direction:column; gap:10px; margin-bottom:4px }
.rcp{ display:flex; align-items:center; gap:12px; padding:8px; border:1px solid var(--line); border-radius:14px }
.rthumb{ width:48px; height:48px; flex:none; border-radius:10px; overflow:hidden; background:var(--s2); display:grid; place-items:center; color:var(--muted) }
.rthumb img{ width:100%; height:100%; object-fit:cover; display:block }
.rcp .grow{ flex:1; min-width:0 }
.rcp .t{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.rcp .s{ margin-top:2px; font-size:13px; color:var(--muted) }
.clipbtn{ position:relative } .clipbtn.has{ color:var(--primary) }
.rcount{ position:absolute; top:0; right:0; min-width:15px; height:15px; padding:0 3px; border-radius:99px; background:var(--primary); color:#fff; font-size:10px; font-weight:700; display:grid; place-items:center }
.grp-body .row,.cat-body .row{ gap:6px }
</style>

<script>
(function () {
  "use strict";
  var MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function cc(x){ return esc(String(x)).replace(/\s+/g,"-"); }
  var fmt = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
  function money(n){ return fmt.format(n||0); }
  function round2(n){ return Math.round((n||0)*100)/100; }
  function spParts(d){ var p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d||new Date()); var o={}; p.forEach(function(x){o[x.type]=x.value;}); return {y:+o.year,m:+o.month,d:+o.day}; }
  function monthKey(){ var t=spParts(); return t.y+"-"+String(t.m).padStart(2,"0"); }
  function prevKey(k){ var a=k.split("-").map(Number); return a[1]===1?(a[0]-1)+"-12":a[0]+"-"+String(a[1]-1).padStart(2,"0"); }
  function nextKey(k){ var a=k.split("-").map(Number); return a[1]===12?(a[0]+1)+"-01":a[0]+"-"+String(a[1]+1).padStart(2,"0"); }
  function label(k){ var a=k.split("-").map(Number); return {name:MONTHS[a[1]-1],year:a[0]}; }
  var CATS={ "Casa":"home","Contas fixas":"home","Alimentação":"bag","Transporte":"car","Saúde":"heart","Lazer":"spark","Cartão de crédito":"card","Investimentos":"trend","Seguros":"shield","Outros":"dots" };
  function icon(name,size){ return '<svg class="ico '+(size||"")+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||"")+'</svg>'; }
  try{ ICONS.clip='<path d="M21 11.5 12.6 20a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.6 1.6 0 0 1-2.3-2.3l7.8-7.8"/>'; ICONS.doc='<path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4"/><path d="M9 13h6M9 17h6"/>'; }catch(e){}
  function fmtSize(b){ b=b||0; if(b<1024) return b+" B"; if(b<1048576) return Math.round(b/1024)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
  var AVATARS=[["frida","Frida Kahlo"],["mona","Mona Lisa"],["young","Jovem do século XIX"],["ermine","Dama com Arminho"],["pearl","Moça com Brinco de Pérola"]];
  function avatarId(id){ return ART[id]?id:"frida"; }
  function avatarImg(id){ return '<img src="'+ART[avatarId(id)]+'" alt="">'; }
  function uidLocal(){ try{return crypto.randomUUID();}catch(e){return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);} }

  /* ---------- estado ---------- */
  var S = { token:null, me:null, household:null, members:[], phase:"loading",
    tab:"inicio", viewMonth:null, openMonth:null, cache:{}, history:[],
    modal:null, editId:null, pickCat:null, pickOwner:null, modalMonth:null,
    billFilter:"all", ownerFilter:"all", authMode:"login", authError:null, authBusy:false,
    formError:null, saving:false, lastTab:null, opened:{}, confirmDel:null, busyMonth:false };

  /* ---------- API ---------- */
  function api(method, path, body){
    return fetch(path, { method:method, headers: Object.assign({"Content-Type":"application/json"}, S.token?{Authorization:"Bearer "+S.token}:{}), body: body?JSON.stringify(body):undefined })
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok) throw (j&&j.error?j:{error:"Erro "+r.status}); return j; }); });
  }
  function loadMonth(mk){ return api("GET","/api/data?month="+mk).then(function(d){ S.cache[mk]={income:d.income,incomeSet:d.incomeSet,bills:d.bills}; S.members=d.members; S.household=d.household; S.me=d.user; return d; }); }
  function loadHistory(){ return api("GET","/api/history").then(function(h){ S.history=h; }); }
  function refreshAll(){ var ms=Object.keys(S.cache); return Promise.all(ms.map(loadMonth)).then(loadHistory).then(render).catch(function(){}); }

  /* ---------- dados derivados ---------- */
  function monthData(mk){ return S.cache[mk]||{income:0,incomeSet:false,bills:[]}; }
  function billsOf(mk){ return monthData(mk).bills||[]; }
  function incomeFor(mk){ return monthData(mk).income||0; }
  function sum(list,f){ return list.reduce(function(a,b){return a+f(b);},0); }
  function firstName(){ var n=(S.me&&S.me.name||"").trim(); return n?n.split(/\s+/)[0]:"por aqui"; }
  function isCouple(){ return S.members.length>1; }
  function memberName(id){ if(S.me&&id===S.me.id) return "Você"; var m=S.members.filter(function(x){return x.id===id;})[0]; return m?m.name:"Parceiro(a)"; }
  function partnerMember(){ return S.members.filter(function(x){return !S.me||x.id!==S.me.id;})[0]||null; }
  function ownerTag(ownerId){ if(ownerId==null) return '<span class="otag sha">Compartilhada</span>'; if(S.me&&ownerId===S.me.id) return '<span class="otag you">Você</span>'; return '<span class="otag par">'+esc(memberName(ownerId))+'</span>'; }
  function dueInfo(b){ if(b.paid||!b.dueDay||!(S.me&&S.me.notifications)) return null; var left=b.dueDay-spParts().d; if(left<0) return {cls:"bad",text:"Atrasada há "+(-left)+(left===-1?" dia":" dias")}; if(left===0) return {cls:"warn",text:"Vence hoje"}; if(left<=3) return {cls:"warn",text:"Vence em "+left+(left===1?" dia":" dias")}; return null; }

  /* ---------- peças ---------- */
  function billRow(b, opts){

  function emptyBills(){ return '<div class="empty"><h3>Nenhuma conta neste mês</h3><p>Adicione suas contas para acompanhar o que já foi pago e o que ainda falta.</p><div class="acts"><button class="btn" data-act="addbill">'+icon("plus","s4")+"Adicionar conta</button></div></div>"; }

  function billsBodyHTML(cur, bills, f){
    var shown=f==="due"?bills.filter(function(b){return !b.paid;}):f==="paid"?bills.filter(function(b){return b.paid;}):bills;
    if(!shown.length) return bills.length?'<div class="empty"><h3>Nada neste filtro</h3><p>Nenhuma conta '+(f==="due"?"a pagar":"paga")+' neste mês.</p></div>':emptyBills();
    S.opened=S.opened||{};
    var groups={},sumAll=0;
    shown.forEach(function(b){ var g=groups[b.category]||(groups[b.category]={name:b.category,items:[],total:0}); g.items.push(b); g.total+=b.amount; sumAll+=b.amount; });
    var glist=Object.keys(groups).map(function(k){return groups[k];}).sort(function(a,b){return b.total-a.total;});
    var paidCount=shown.filter(function(b){return b.paid;}).length;
    var RING=["var(--ring-a)","var(--ring-b)","var(--ring-c)","var(--ring-d)","var(--ring-e)"];
    var out='<section><div class="sec-head"><h2>Por categoria</h2><span class="pill num">'+paidCount+"/"+shown.length+" pagas</span></div><div class=\"list\">";
    out+=glist.map(function(g,i){
      var pct=sumAll?g.total/sumAll*100:0, open=!!S.opened[g.name], np=g.items.filter(function(b){return !b.paid;}).length;
      var subt=money(g.total)+" · "+(np?"<b>"+np+" a pagar</b>":g.items.length+(g.items.length===1?" conta":" contas")+" · tudo pago");
      var rows=g.items.slice().sort(function(a,b){return (a.dueDay||99)-(b.dueDay||99)||b.amount-a.amount;});
      return '<button class="cat-h'+(open?" open":"")+'" data-act="grp" data-cat="'+esc(g.name)+'" aria-expanded="'+open+'"><span class="ring" style="--p:'+pct.toFixed(1)+";--rc:"+RING[i%RING.length]+'"><b class="num">'+Math.round(pct)+'%</b></span><span class="grow"><span class="cat-name">'+esc(g.name)+'</span><span class="cat-sub num">'+subt+'</span></span><span class="caret" style="'+(open?"transform:rotate(180deg)":"")+'">'+icon("caret","s4")+"</span></button>"+(open?'<div class="cat-body">'+rows.map(function(b){return billRow(b,{edit:true,deletable:true});}).join("")+"</div>":"");
    }).join("")+"</div></section>";
    return out;
  }

  function homeHeader(lab){
    return '<header class="hdr" style="display:flex;align-items:center;gap:12px;padding:16px 20px 8px"><button class="avatar" data-act="tab" data-tab="perfil" style="width:48px;height:48px;border-radius:16px;padding:0;border:0" aria-label="Abrir perfil">'+avatarImg(S.me&&S.me.avatar)+'</button><div style="flex:1;min-width:0"><p style="font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Olá, '+esc(firstName())+'</p><p style="font-size:14px;color:var(--muted)">'+lab.name+" de "+lab.year+'</p></div></header>';
  }
  function viewHome(cur){

    var paid=round2(sum(bills.filter(function(b){return b.paid;}),function(b){return b.amount;}));
    var pending=round2(total-paid), pct=salary?Math.round(total/salary*100):0;
    var hdr=homeHeader(lab);
    if(!bills.length&&!salary){ return hdr+'<main class="main"><div class="empty"><h3>Vamos começar o seu mês</h3><p>Dois passos e o Grana mostra quanto sobra.</p><ol class="steps"><li><b>1</b>Informe a sua renda do mês</li><li><b>2</b>Adicione as contas que você paga</li></ol><div class="acts"><button class="btn" data-act="income">Informar renda</button><button class="btn tonal" data-act="addbill">Adicionar conta</button></div></div></main>'; }
    var left=round2(salary-total);
    var hero='<section class="hero"><p class="lab">Sobra do mês</p><p class="big num'+(left<0?" neg":"")+'">'+money(left)+'</p><div class="meter"><i style="width:'+Math.max(0,Math.min(pct,100))+'%"></i></div><div class="mfoot"><span class="soft num">'+money(total)+' em contas</span><span class="num">'+(salary?pct+"% da renda":"—")+'</span></div><div class="hero-grid"><div class="hstat"><p class="k"><span class="dot" style="background:var(--good-dot)"></span>Entradas</p><p class="v num">'+money(salary)+'</p></div><div class="hstat"><p class="k"><span class="dot" style="background:var(--warn-dot)"></span>Falta pagar</p><p class="v num">'+money(pending)+'</p></div></div></section>';
    var qa='<nav class="qa-row" aria-label="Atalhos"><button class="qa primary" data-act="addbill"><span class="ic">'+icon("plus")+'</span>Nova conta</button><button class="qa" data-act="income"><span class="ic">'+icon("wallet")+'</span>Renda</button><button class="qa" data-act="tab" data-tab="historico"><span class="ic">'+icon("calendar")+'</span>Histórico</button></nav>';
    var upcoming=bills.filter(function(b){return !b.paid;}).slice().sort(function(a,b){return (a.dueDay||99)-(b.dueDay||99);});
    var soon=upcoming.filter(function(b){return dueInfo(b);});
    var callout="";

    var listSec=upcoming.length?'<section><div class="sec-head"><h2>Próximos vencimentos</h2><button class="link" data-act="tab" data-tab="contas">Ver todas</button></div><div class="list">'+upcoming.slice(0,4).map(function(b){return billRow(b,{});}).join("")+"</div></section>":"";
    var recap="";
    if(S.me&&S.me.monthlySummary&&S.history.length){ var m=S.history[0], sobra=m.income-m.spent, L=label(m.month); recap='<section class="recap"><span class="ic">'+icon("calendar")+'</span><div><p>Em '+L.name+" "+(sobra>=0?"sobraram ":"faltaram ")+'<b class="num">'+money(Math.abs(sobra))+"</b></p><small>"+money(m.spent)+" pagos de "+money(m.income)+" de renda</small></div></section>"; }
    return hdr+'<main class="main">'+hero+qa+callout+listSec+recap+"</main>";

  function coupleSummary(bills){
    var byId={}, shared=0;
    S.members.forEach(function(m){byId[m.id]=0;});
    bills.forEach(function(b){ if(b.ownerId==null) shared+=b.amount; else if(byId[b.ownerId]!=null) byId[b.ownerId]+=b.amount; else byId[b.ownerId]=b.amount; });
    var n=S.members.length||1, share=round2(shared/n);
    var rows=S.members.map(function(m,i){ var cls=i===0?"you":"par"; var pers=round2(byId[m.id]||0); var tot=round2(pers+share); var nm=(S.me&&m.id===S.me.id)?"Você":m.name;
      return '<div class="crow"><span class="cdot '+cls+'"></span><div class="grow"><p class="t">'+esc(nm)+'</p><p class="s num">Pessoais '+money(pers)+" + parte do pote "+money(share)+'</p></div><p class="amount num">'+money(tot)+"</p></div>"; }).join("");
    rows+='<div class="crow"><span class="cdot sha"></span><div class="grow"><p class="t">Pote comum</p><p class="s">Dividido igualmente entre vocês</p></div><p class="amount num">'+money(shared)+"</p></div>";
    return '<section><div class="sec-head"><h2>Resumo do casal</h2></div><div class="list">'+rows+"</div></section>";
  }

  function viewBills(cur){

    return hdr+'<main class="main">'+stats+incomeLine+summary+ownerSeg+seg+'<div id="billsbody">'+billsBodyHTML(cur,scoped,f)+"</div></main>";

  function viewHistory(){

  /* ---------- render ---------- */
  function render(){
    var app=document.getElementById("app");
    if(S.phase==="loading"){ app.innerHTML='<div class="load">Carregando o Grana…</div>'; return; }
    if(S.phase==="signedout"){ app.innerHTML=authScreen(); var fi=app.querySelector("input"); return; }
    var body;
    if(S.tab==="inicio") body=viewHome(monthKey());
    else if(S.tab==="contas"){ var mk=S.viewMonth||monthKey(); body=S.cache[mk]?viewBills(mk):'<div class="load">Carregando…</div>'; }
    else if(S.tab==="historico") body=viewHistory();
    else body=viewProfile();
    var an=S.lastTab!==S.tab; S.lastTab=S.tab;
    app.innerHTML='<div class="screen'+(an?" anim":"")+'">'+body+"</div>"+tabbar();
  }

  /* ---------- modais ---------- */
  function sheetHead(title,sub,close){ return '<div class="sheet-head"><div><h2>'+esc(title)+"</h2>"+(sub?"<p>"+esc(sub)+"</p>":"")+"</div>"+(close?'<button class="closeb" data-act="close" aria-label="Fechar">'+icon("close")+"</button>":"")+"</div>"; }
  function renderModal(){
    var el=document.getElementById("modal"); if(!S.modal){ el.innerHTML=""; return; }
    var err=S.formError?'<p class="err" role="alert">'+esc(S.formError)+"</p>":""; var inner;
    if(S.modal==="bill"){
      var mk=S.modalMonth||monthKey();
      var eb=S.editId?billsOf(mk).filter(function(x){return x.id===S.editId;})[0]:null;
      var catKeys=Object.keys(CATS); if(eb&&catKeys.indexOf(eb.category)<0) catKeys.push(eb.category);
      var selCat=S.pickCat||(eb?eb.category:"Contas fixas");
      var chips=catKeys.map(function(c){return '<button type="button" class="chip" data-act="pickcat" data-cat="'+esc(c)+'" aria-pressed="'+(c===selCat)+'">'+esc(c)+"</button>";}).join("");
      var ownerField="";
      if(isCouple()){
        var selOwner=S.pickOwner||(eb?(eb.ownerId==null?"shared":eb.ownerId):"me");
        var OWN=[["me","Você"]]; var pm=partnerMember(); if(pm) OWN.push([pm.id,pm.name]); OWN.push(["shared","Compartilhada"]);
        var ochips=OWN.map(function(o){return '<button type="button" class="chip" data-act="pickowner" data-o="'+esc(o[0])+'" aria-pressed="'+(String(o[0])===String(selOwner))+'">'+esc(o[1])+"</button>";}).join("");
        ownerField='<div class="field"><span class="lab">De quem é?</span><input type="hidden" name="owner" value="'+esc(selOwner)+'"><div class="chips ochips">'+ochips+"</div></div>";
      }
      inner=sheetHead(eb?"Editar conta":"Nova conta",eb?"Altere os dados desta conta.":"Adicione um gasto em poucos segundos.",true)+
        '<form class="form" data-form="bill" novalidate><div class="value-field"><label for="f-amount">Valor</label><input id="f-amount" class="value-input num" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="R$ 0,00" value="'+(eb?eb.amount:"")+'" required></div><div class="field"><label for="f-title">Nome da conta</label><input id="f-title" class="inp" name="title" maxlength="80" placeholder="Ex.: Conta de água" autocomplete="off" value="'+(eb?esc(eb.title):"")+'" required></div><div class="field"><label for="f-day">Vencimento <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><input id="f-day" class="inp" name="dueDay" type="number" inputmode="numeric" min="1" max="31" placeholder="Dia do mês, de 1 a 31" value="'+(eb&&eb.dueDay?eb.dueDay:"")+'"></div><div class="field"><span class="lab">Categoria</span><input type="hidden" name="category" value="'+esc(selCat)+'"><div class="chips">'+chips+"</div></div>"+ownerField+err+'<button class="btn wide" type="submit"'+(S.saving?" disabled":"")+">"+(eb?"Salvar alterações":"Adicionar conta")+"</button></form>";
    } else if(S.modal==="income"){
      var v=incomeFor(S.modalMonth||monthKey());
      inner=sheetHead("Atualizar renda","Informe a receita total do mês.",true)+'<form class="form" data-form="income" novalidate><div class="value-field"><label for="f-income">Renda mensal</label><input id="f-income" class="value-input num" name="income" type="number" inputmode="decimal" min="0" step="0.01" value="'+(v||"")+'" placeholder="R$ 0,00" required></div>'+err+'<button class="btn wide" type="submit"'+(S.saving?" disabled":"")+">Salvar renda</button></form>";
    } else if(S.modal==="join"){
      inner=sheetHead("Código de convite","Digite o código que seu par compartilhou.",true)+'<form class="form" data-form="join" novalidate><div class="field"><label for="f-code">Código</label><input id="f-code" class="inp" name="code" maxlength="6" autocomplete="off" placeholder="Ex.: ABC234" style="text-transform:uppercase;letter-spacing:.2em;font-weight:700"></div>'+err+'<button class="btn wide" type="submit"'+(S.saving?" disabled":"")+">Entrar na casa</button></form>";
    } else if(S.modal==="import"){
      var impM=label(S.modalMonth||monthKey());
      inner=sheetHead("Importar contas","Cole sua lista. As contas entram em "+impM.name+" de "+impM.year+".",true)+'<form class="form" data-form="import" novalidate><div class="field"><label for="f-bulk">Sua lista</label><textarea id="f-bulk" class="inp area" name="bulk" placeholder="Cole aqui suas contas, uma por linha…"></textarea><p class="hint">Linhas com 🆗️ entram como pagas. A categoria é detectada pelo nome.</p></div>'+err+'<button class="btn wide" type="submit"'+(S.saving?" disabled":"")+">Importar</button></form>";
    } else if(S.modal==="receipts"){
      var rmk=S.modalMonth||monthKey();
      var rbill=billsOf(rmk).filter(function(x){return x.id===S.receiptBill;})[0]||{receipts:[]};
      var T=encodeURIComponent(S.token||"");
      var recs=(rbill.receipts||[]).map(function(r){ var img=(r.contentType||"").indexOf("image/")===0; var url="/api/receipts/"+r.id+"?token="+T;
        return '<div class="rcp"><a class="rthumb'+(img?"":" doc")+'" href="'+url+'" target="_blank" rel="noopener">'+(img?'<img src="'+url+'" alt="">':icon("doc"))+'</a><div class="grow"><p class="t">'+esc(r.name)+'</p><p class="s">'+fmtSize(r.size)+(img?" · imagem":" · PDF")+'</p></div><a class="iconbtn" href="'+url+'" target="_blank" rel="noopener" aria-label="Ver">'+icon("eye","s4")+'</a><button class="iconbtn bad" data-act="delreceipt" data-id="'+esc(r.id)+'" aria-label="Excluir">'+icon("trash","s4")+"</button></div>"; }).join("");
      var listHtml=recs?('<div class="rlist">'+recs+"</div>"):'<p class="note">Nenhum comprovante ainda. Anexe a imagem ou o PDF do pagamento.</p>';
      inner=sheetHead("Comprovantes",(rbill.title||"")+" · imagem ou PDF",true)+(S.formError?'<p class="err">'+esc(S.formError)+"</p>":"")+listHtml+'<label class="btn wide tonal" style="margin-top:12px;cursor:pointer">'+icon("plus","s4")+(S.saving?"Enviando…":"Adicionar comprovante")+'<input type="file" accept="image/*,application/pdf" data-upload hidden'+(S.saving?" disabled":"")+"></label>";
    } else {
      inner=sheetHead("Editar nome","Como o Grana deve chamar você.",true)+'<form class="form" data-form="name" novalidate><div class="field"><label for="f-name">Nome</label><input id="f-name" class="inp" name="name" maxlength="60" value="'+esc(S.me&&S.me.name||"")+'" autocomplete="off" required></div>'+err+'<button class="btn wide" type="submit">Salvar</button></form>';
    }
    el.innerHTML='<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+inner+"</div></div>";
    var first=el.querySelector('input:not([type=hidden]), textarea'); if(first) first.focus();
  }
  function openModal(name,editId){ S.editId=editId||null; S.modal=name; S.formError=null; S.saving=false; S.modalMonth=(S.tab==="contas"&&S.viewMonth)?S.viewMonth:monthKey(); if(name==="bill"){ var eb=editId?billsOf(S.modalMonth).filter(function(x){return x.id===editId;})[0]:null; S.pickCat=eb?eb.category:"Contas fixas"; S.pickOwner=eb?(eb.ownerId==null?"shared":eb.ownerId):"me"; } renderModal(); }
  function closeModal(){ S.modal=null; S.editId=null; S.formError=null; S.saving=false; S.pickCat=null; S.pickOwner=null; renderModal(); }

  var toastTimer;
  function toast(msg){ var t=document.getElementById("toast"); t.className="toast"; t.textContent=msg; clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.className="";t.textContent="";},4000); }

  /* ---------- importação (parser) ---------- */
  function parseImport(text){
    var lines=String(text||"").split(/\r?\n/), out=[], curCat="Outros", curKnown=false;
    var HEAD=[["cart","Cartão de crédito"],["essenci","Contas fixas"],["fixa","Contas fixas"],["investi","Investimentos"],["seguro","Seguros"],["aliment","Alimentação"],["transp","Transporte"],["saúde","Saúde"],["saude","Saúde"],["lazer","Lazer"],["casa","Casa"],["outro","Outros"]];
    var KW=[["cartã","Cartão de crédito"],["cartao","Cartão de crédito"],["black","Cartão de crédito"],["crédit","Cartão de crédito"],["credit","Cartão de crédito"],["fatura","Cartão de crédito"],["seguro","Seguros"],["tesouro","Investimentos"],["selic","Investimentos"],["ipca","Investimentos"],["cdb","Investimentos"],["invest","Investimentos"],["ações","Investimentos"],["luz","Contas fixas"],["energia","Contas fixas"],["internet","Contas fixas"],["5g","Contas fixas"],["garagem","Contas fixas"],["água","Contas fixas"],["agua","Contas fixas"],["condom","Contas fixas"],["aluguel","Contas fixas"],["gás","Contas fixas"],["mercado","Alimentação"],["comida","Alimentação"],["ifood","Alimentação"],["uber","Transporte"],["gasolina","Transporte"],["médic","Saúde"],["farmác","Saúde"],["academia","Saúde"],["barbeiro","Lazer"],["cinema","Lazer"],["viagem","Lazer"]];
    var EMO=/[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2460}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}]/gu;
    function clean(x){ return x.replace(EMO,"").replace(/\s{2,}/g," ").trim(); }
    function amountOf(x){ var m=x.match(/R\$\s*([\d.]+,\d{1,2}|[\d.]+)/); var raw=m?m[1]:null; if(raw==null){var m2=x.match(/(\d[\d.]*,\d{1,2}|\d[\d.]{2,}|\d+)\s*$/);raw=m2?m2[1]:null;} if(raw==null)return null; raw=raw.replace(/\./g,"").replace(",","."); var n=parseFloat(raw); return isFinite(n)&&n>0?n:null; }
    lines.forEach(function(ln){ var line=ln.trim(); if(!line) return; var amt=amountOf(line); var low=clean(line).toLowerCase();
      if(amt==null){ curKnown=false; for(var h=0;h<HEAD.length;h++){ if(low.indexOf(HEAD[h][0])>=0){curCat=HEAD[h][1];curKnown=true;break;} } return; }
      var paid=/🆗|✅|☑|✔|\[x\]|\[X\]|\bpago\b/.test(line);
      var t=line.replace(/\[[^\]]*\]/g,""); t=t.split(/R\$/)[0]; t=t.replace(/[—–\-]\s*$/,""); t=clean(t); if(!t) return;
      var cat; if(curKnown){cat=curCat;} else { cat=null; for(var k=0;k<KW.length;k++){ if(low.indexOf(KW[k][0])>=0){cat=KW[k][1];break;} } if(!cat)cat="Outros"; }
      out.push({title:t.slice(0,80),amount:round2(amt),category:cat,paid:!!paid});
    });
    return out;
  }

  /* ---------- ações de escrita ---------- */
  function afterWrite(mk){ return loadMonth(mk).then(loadHistory).then(render).catch(function(e){ toast((e&&e.error)||"Erro ao salvar"); }); }
  function submitForm(form){
    var kind=form.getAttribute("data-form"), fd=new FormData(form);
    function bad(msg){ S.formError=msg; renderModal(); var f=document.querySelector("#modal input, #modal textarea"); if(f) f.focus(); }
    if(kind==="auth"){
      var email=String(fd.get("email")||"").trim(), pass=String(fd.get("password")||""), nm=String(fd.get("name")||"");
      S.authError=null; S.authBusy=true; render();
      var wasSignup=S.authMode==="signup";
      var op=wasSignup?api("POST","/api/register",{email:email,password:pass,name:nm}):api("POST","/api/login",{email:email,password:pass});
      op.then(function(d){ S.token=d.token; try{localStorage.setItem("grana:token",d.token);}catch(e){} S.me=d.user; S.household=d.household; S.members=d.members; S.viewMonth=monthKey(); S.cache={}; S.phase="ready"; S.authBusy=false; S.authError=null; return Promise.all([loadMonth(monthKey()),loadHistory()]); })
        .then(function(){ render(); connectSSE(); })
        .catch(function(e){ S.authBusy=false; S.authError=(e&&e.error)||"Não foi possível continuar."; render(); });
      return;
    }
    if(kind==="join"){
      var code=String(fd.get("code")||"").trim().toUpperCase(); if(code.length<4) return bad("Informe o código.");
      S.saving=true; renderModal();
      api("POST","/api/join",{code:code}).then(function(d){ S.household=d.household; S.members=d.members; S.me=d.user; S.cache={}; S.viewMonth=monthKey(); closeModal(); toast("Você entrou na casa!"); return Promise.all([loadMonth(monthKey()),loadHistory()]); }).then(function(){ connectSSE(); render(); }).catch(function(e){ S.saving=false; bad((e&&e.error)||"Não foi possível entrar."); });
      return;
    }
    if(kind==="import"){
      var items=parseImport(fd.get("bulk")||""); if(!items.length) return bad("Não encontrei contas no texto. Cole sua lista com os valores, ex.: R$ 150,00.");
      var mk=S.modalMonth||monthKey(); S.saving=true; renderModal();
      Promise.all(items.map(function(it){ return api("POST","/api/bills",{month:mk,title:it.title,category:it.category,amount:it.amount,paid:it.paid,owner:"shared"}); }))
        .then(function(){ closeModal(); toast(items.length+(items.length===1?" conta importada":" contas importadas")); return afterWrite(mk); })
        .catch(function(e){ S.saving=false; bad((e&&e.error)||"Erro ao importar."); });
      return;
    }
    if(kind==="bill"){
      var mk2=S.modalMonth||monthKey();
      var title=String(fd.get("title")||"").trim(), amount=round2(Number(fd.get("amount")));
      var dayStr=String(fd.get("dueDay")||"").trim(), day=dayStr===""?0:Math.trunc(Number(fd.get("dueDay")));
      var cat=String(fd.get("category")), owner=isCouple()?String(fd.get("owner")||"me"):"me";
      if(!title) return bad("Informe o nome da conta.");
      if(!(amount>0)) return bad("Informe um valor maior que zero.");
      if(day!==0&&!(day>=1&&day<=31)) return bad("O vencimento deve ser entre 1 e 31.");
      var eid=S.editId; S.saving=true; renderModal();
      var op2=eid?api("PATCH","/api/bills/"+eid,{title:title,category:cat,amount:amount,dueDay:day,owner:owner}):api("POST","/api/bills",{month:mk2,title:title,category:cat,amount:amount,dueDay:day,owner:owner,paid:false});
      op2.then(function(){ closeModal(); return afterWrite(mk2); }).catch(function(e){ S.saving=false; bad((e&&e.error)||"Erro ao salvar."); });
      return;
    }
    if(kind==="income"){
      var inc=round2(Number(fd.get("income"))); if(!(inc>=0)||String(fd.get("income")).trim()==="") return bad("Informe um valor válido.");
      var mk3=S.modalMonth||monthKey(); S.saving=true; renderModal();
      api("PUT","/api/income",{month:mk3,amount:inc}).then(function(){ closeModal(); return afterWrite(mk3); }).catch(function(e){ S.saving=false; bad((e&&e.error)||"Erro ao salvar."); });
      return;
    }
    // name
    var name=String(fd.get("name")||"").trim(); if(name.length<2) return bad("Informe seu nome.");
    closeModal(); api("PATCH","/api/profile",{name:name}).then(function(u){ S.me=u; render(); }).catch(function(e){ toast((e&&e.error)||"Erro"); });
  }

  function saveProfilePatch(patch){ var prev=S.me; S.me=Object.assign({},S.me,patch); render(); api("PATCH","/api/profile",patch).then(function(u){ S.me=u; render(); }).catch(function(e){ S.me=prev; render(); toast((e&&e.error)||"Erro"); }); }

  function goMonth(mk){ S.viewMonth=mk; S.billFilter="all"; S.opened={}; if(S.cache[mk]){ render(); } else { render(); loadMonth(mk).then(render).catch(function(e){toast((e&&e.error)||"Erro");}); } }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function(ev){
    var scrim=ev.target.closest&&ev.target.closest("[data-scrim]"); if(scrim&&ev.target===scrim){ closeModal(); return; }
    var el=ev.target.closest("[data-act]"); if(!el) return;
    var act=el.getAttribute("data-act"), id=el.getAttribute("data-id");
    var cur=(S.tab==="contas"&&S.viewMonth)?S.viewMonth:monthKey();
    switch(act){
      case "tab": S.tab=el.getAttribute("data-tab"); S.openMonth=null; S.confirmDel=null; if(S.tab==="contas"){ S.viewMonth=monthKey(); loadMonth(S.viewMonth).then(render).catch(function(){}); } if(S.tab==="historico") loadHistory().then(render); render(); window.scrollTo(0,0); break;
      case "addbill": openModal("bill"); break;
      case "editbill": openModal("bill",id); break;
      case "receipts": S.receiptBill=id; S.modal="receipts"; S.formError=null; S.saving=false; S.modalMonth=(S.tab==="contas"&&S.viewMonth)?S.viewMonth:monthKey(); renderModal(); break;
      case "delreceipt": { var rdmk=S.modalMonth||monthKey(); api("DELETE","/api/receipts/"+id).then(function(){ return loadMonth(rdmk); }).then(function(){ renderModal(); loadHistory(); }).catch(function(e){ toast((e&&e.error)||"Erro"); }); break; }
      case "income": openModal("income"); break;
      case "editname": openModal("name"); break;
      case "join": openModal("join"); break;
      case "import": openModal("import"); break;
      case "close": closeModal(); break;
      case "toggle": { var b=billsOf(cur).filter(function(x){return x.id===id;})[0]; if(!b) break; b.paid=!b.paid; render(); api("PATCH","/api/bills/"+id,{paid:b.paid}).then(function(){loadHistory();}).catch(function(e){ b.paid=!b.paid; render(); toast((e&&e.error)||"Erro"); }); break; }
      case "askdel": S.confirmDel=id; render(); break;
      case "canceldel": S.confirmDel=null; render(); break;
      case "del": { S.confirmDel=null; var mk=cur; S.cache[mk].bills=billsOf(mk).filter(function(x){return x.id!==id;}); render(); api("DELETE","/api/bills/"+id).then(function(){loadHistory();}).catch(function(e){ afterWrite(mk); toast((e&&e.error)||"Erro"); }); break; }
      case "grp": S.opened=S.opened||{}; var gk=el.getAttribute("data-cat"); S.opened[gk]=!S.opened[gk]; render(); break;
      case "month": { var key=el.getAttribute("data-key"); if(S.cache[key]){ S.openMonth=key; render(); } else { loadMonth(key).then(function(){ S.openMonth=key; render(); }); } window.scrollTo(0,0); break; }
      case "back": S.openMonth=null; render(); break;
      case "avatar": saveProfilePatch({avatar:id}); break;
      case "pref": var k=el.getAttribute("data-key"), patch={}; patch[k]=!(S.me&&S.me[k]); saveProfilePatch(patch); break;
      case "prevmonth": goMonth(prevKey(S.viewMonth||monthKey())); break;
      case "nextmonth": goMonth(nextKey(S.viewMonth||monthKey())); break;
      case "filter": S.billFilter=el.getAttribute("data-f"); var sb=document.querySelectorAll("#statusseg button"); for(var i=0;i<sb.length;i++){ sb[i].setAttribute("aria-pressed", sb[i].getAttribute("data-f")===S.billFilter); } var mk2=cur, bb=document.getElementById("billsbody"); if(bb){ var of=S.ownerFilter||"all"; var sc=(isCouple()&&of!=="all")?billsOf(mk2).filter(function(x){return of==="shared"?x.ownerId==null:x.ownerId===of;}):billsOf(mk2); bb.innerHTML=billsBodyHTML(mk2,sc,S.billFilter); } break;
      case "ownerfilter": S.ownerFilter=el.getAttribute("data-o"); S.billFilter="all"; S.opened={}; render(); break;
      case "copycode": var code=S.household&&S.household.inviteCode||""; try{ navigator.clipboard.writeText(code); toast("Código copiado: "+code); }catch(e){ toast("Código: "+code); } break;
      case "eye": var pe=el.parentNode&&el.parentNode.querySelector("input"); if(pe) pe.type=pe.type==="password"?"text":"password"; break;
      case "pickcat": S.pickCat=el.getAttribute("data-cat"); var hc=document.querySelector("#modal input[name=category]"); if(hc) hc.value=S.pickCat; var cps=document.querySelectorAll("#modal .chips:not(.ochips) .chip"); for(var ci=0;ci<cps.length;ci++){ cps[ci].setAttribute("aria-pressed", cps[ci].getAttribute("data-cat")===S.pickCat); } break;
      case "pickowner": S.pickOwner=el.getAttribute("data-o"); var ho=document.querySelector("#modal input[name=owner]"); if(ho) ho.value=S.pickOwner; var ocs=document.querySelectorAll("#modal .ochips .chip"); for(var oi=0;oi<ocs.length;oi++){ ocs[oi].setAttribute("aria-pressed", ocs[oi].getAttribute("data-o")===S.pickOwner); } break;
      case "authmode": S.authMode=S.authMode==="signup"?"login":"signup"; S.authError=null; render(); break;
      case "logout": try{localStorage.removeItem("grana:token");}catch(e){} if(S._es){try{S._es.close();}catch(e){}} S.token=null; S.me=null; S.household=null; S.members=[]; S.cache={}; S.history=[]; S.tab="inicio"; S.phase="signedout"; S.authMode="login"; render(); break;
    }
  });
  document.addEventListener("change", function(ev){ var inp=ev.target; if(!inp||!inp.matches||!inp.matches("input[data-upload]")) return; var file=inp.files&&inp.files[0]; if(!file) return; if(file.size>8*1024*1024){ toast("Arquivo muito grande (máx 8 MB)"); return; } var billId=S.receiptBill, mk=S.modalMonth||monthKey(); S.saving=true; renderModal();
    fetch("/api/bills/"+billId+"/receipts",{method:"POST",headers:{Authorization:"Bearer "+S.token,"Content-Type":file.type||"application/octet-stream","X-Filename":encodeURIComponent(file.name||"comprovante")},body:file})
      .then(function(r){ if(!r.ok) return r.json().catch(function(){return{};}).then(function(j){ throw (j&&j.error?j:{error:"Falha no envio"}); }); return r.json(); })
      .then(function(){ return loadMonth(mk); }).then(function(){ S.saving=false; renderModal(); loadHistory(); }).catch(function(e){ S.saving=false; renderModal(); toast((e&&e.error)||"Falha no envio"); });
  });
  document.addEventListener("submit", function(ev){ var form=ev.target.closest&&ev.target.closest("[data-form]"); if(!form) return; ev.preventDefault(); submitForm(form); });
  document.addEventListener("keydown", function(ev){ if(ev.key==="Escape"&&S.modal) closeModal(); });

  /* ---------- tempo real ---------- */
  function connectSSE(){ try{ if(S._es){try{S._es.close();}catch(e){}} var es=new EventSource("/api/events?token="+encodeURIComponent(S.token)); es.addEventListener("change",function(){ refreshAll(); }); S._es=es; }catch(e){} }

  /* ---------- boot ---------- */
  function boot(){
    try{ S.token=localStorage.getItem("grana:token"); }catch(e){ S.token=null; }
    if(!S.token){ S.phase="signedout"; render(); return; }
    api("GET","/api/me").then(function(d){ S.me=d.user; S.household=d.household; S.members=d.members; S.viewMonth=monthKey(); S.phase="ready"; return Promise.all([loadMonth(monthKey()),loadHistory()]); })
      .then(function(){ render(); connectSSE(); })
      .catch(function(){ try{localStorage.removeItem("grana:token");}catch(e){} S.token=null; S.phase="signedout"; render(); });
  }
  render(); boot();
})();
</script>
